name: Check
on:
  push:
    branches: [main, feat/navigation-foundation-ultraviolet, feat/hybrid-agency-redesign, sync/lemma-clean-2026-11-28]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npm run check:site
